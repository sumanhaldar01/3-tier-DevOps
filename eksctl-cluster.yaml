apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: devops-hub-cluster
  region: eu-north-1
  version: "1.35"

# ── OIDC ──
# withOIDC: true replaces the separate command:
#   eksctl utils associate-iam-oidc-provider --cluster devops-hub-cluster --approve
# Now it happens automatically during cluster creation — one less step.
iam:
  withOIDC: true

managedNodeGroups:
  - name: devops-hub-nodes
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    privateNetworking: true
    # NOTE: removed withAddonPolicies (ebs/albIngress) from here on purpose.
    # That old pattern gives the permission to the NODE — every pod on it inherits it.
    # We use the addon block below instead — scoped to just the CSI driver pod.

# ── EBS CSI Driver — auto IAM role + policy + addon install, all in one ──
# wellKnownPolicies.ebsCSIController: true does 3 things automatically:
#   1. Creates IAM role scoped to a Kubernetes ServiceAccount (not the node)
#   2. Attaches AmazonEBSCSIDriverPolicy to that role
#   3. Installs the aws-ebs-csi-driver addon wired to use that role
# Replaces: eksctl create iamserviceaccount + aws eks create-addon (2 separate commands)
addons:
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true