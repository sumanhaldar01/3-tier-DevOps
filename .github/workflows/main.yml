name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s-manifests/**'
      - '**.md'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Cache npm deps between runs — faster pipeline on repeated pushes
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        # npm ci = uses package-lock.json exactly. Reproducible. Faster than npm install.
        run: npm ci

      - name: Run tests
        working-directory: ./backend
        run: npm test

  lint:
    name: Static Code Analysis (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint

  docker-backend:
    name: Build, Scan & Push Backend
    runs-on: ubuntu-latest
    needs: [test, lint]  
    outputs:
      image_tag: ${{ steps.tag.outputs.short_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA tag
        id: tag
        # Cut SHA to 7 chars. Stored as step output AND env var.
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/backend
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true            # load into local docker, not registry
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit cache — reuses layers from previous runs via GitHub Actions cache
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan — backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/backend:sha-${{ env.SHORT_SHA }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      # Only push AFTER scan passes.
      # If scan failed, this step never runs → vulnerable image never on DockerHub.
      - name: Push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-frontend:
    name: Build, Scan & Push Frontend
    runs-on: ubuntu-latest
    needs: [test, lint]          # same gate as backend
    outputs:
      image_tag: ${{ steps.tag.outputs.short_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA tag
        id: tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/frontend
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan — frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/frontend:sha-${{ env.SHORT_SHA }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifests:
    name: Update Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: [docker-backend, docker-frontend]
    # Only run on actual push to main — not on PRs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Use PAT with write access — default GITHUB_TOKEN can't push to protected branches
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # full history needed for git push

      - name: Setup Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update image tags in manifests
        env:
          IMAGE_TAG: ${{ needs.docker-backend.outputs.image_tag }}
        run: |
          # sed -i = edit file in-place
          # Pattern: match "image: dockeruser/backend:" followed by anything → replace tag
          sed -i \
            "s|image: ${{ secrets.DOCKER_USERNAME }}/backend:.*|image: ${{ secrets.DOCKER_USERNAME }}/backend:${IMAGE_TAG}|g" \
            k8s-manifests/backend-deployment.yaml

          sed -i \
            "s|image: ${{ secrets.DOCKER_USERNAME }}/frontend:.*|image: ${{ secrets.DOCKER_USERNAME }}/frontend:${IMAGE_TAG}|g" \
            k8s-manifests/frontend-deployment.yaml

          # Confirm what changed
          echo "── backend manifest ──"
          grep "image:" k8s-manifests/backend-deployment.yaml

          echo "── frontend manifest ──"
          grep "image:" k8s-manifests/frontend-deployment.yaml

      - name: Commit and push manifest changes
        env:
          IMAGE_TAG: ${{ needs.docker-backend.outputs.image_tag }}
        run: |
          git add k8s-manifests/backend-deployment.yaml \
                  k8s-manifests/frontend-deployment.yaml

          # [skip ci] → GitHub Actions ignores this commit — no new pipeline run.
          # This is the second safety net after paths-ignore.
          git commit -m "ci: update image tags to ${IMAGE_TAG} [skip ci]" \
            || echo "No changes to commit"

          git push

  argocd-sync:
    name: ArgoCD Instant Sync
    runs-on: ubuntu-latest
    needs: [update-manifests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/
          argocd version --client

      # Login using token — never username/password in pipelines.
      # --grpc-web → works even if ArgoCD is behind HTTP proxy/ALB (which it is on EKS).
      # --insecure → skip TLS cert check (ALB self-signed cert). Remove once you add real cert.
      - name: Force ArgoCD sync
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          argocd app sync devops-hub \
            --server $ARGOCD_SERVER \
            --insecure \
            --grpc-web \
            --force

      - name: Wait for healthy deployment
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          argocd app wait devops-hub \
            --server $ARGOCD_SERVER \
            --health \
            --sync \
            --insecure \
            --grpc-web \
            --timeout 180