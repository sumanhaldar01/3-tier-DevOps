<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevOps Hub</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0a0e1a;
    --surface:  #111827;
    --border:   #1e2d45;
    --accent:   #00d4ff;
    --green:    #00ff9d;
    --yellow:   #ffd166;
    --red:      #ff6b6b;
    --purple:   #b48ead;
    --text:     #c9d1d9;
    --muted:    #4a5568;
    --white:    #f0f6fc;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scanline effect — subtle terminal feel */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,212,255,0.015) 2px,
      rgba(0,212,255,0.015) 4px
    );
    pointer-events: none;
    z-index: 1000;
  }

  /* ─── HEADER ─── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 20px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: rgba(10,14,26,0.95);
    backdrop-filter: blur(12px);
    z-index: 100;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
    border: 2px solid var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--accent);
    font-weight: 700;
    box-shadow: 0 0 12px rgba(0,212,255,0.3);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 12px rgba(0,212,255,0.3); }
    50%       { box-shadow: 0 0 24px rgba(0,212,255,0.6); }
  }

  .logo-text {
    font-size: 20px;
    font-weight: 800;
    color: var(--white);
    letter-spacing: -0.5px;
  }

  .logo-text span { color: var(--accent); }

  .header-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: blink 1.5s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.4; }
  }

  /* ─── HERO ─── */
  .hero {
    padding: 60px 40px 40px;
    text-align: center;
    position: relative;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 200px;
    background: radial-gradient(ellipse at center, rgba(0,212,255,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-tag {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    border: 1px solid rgba(0,212,255,0.3);
    padding: 4px 12px;
    border-radius: 100px;
    margin-bottom: 20px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .hero h1 {
    font-size: clamp(32px, 5vw, 56px);
    font-weight: 800;
    color: var(--white);
    line-height: 1.1;
    letter-spacing: -2px;
    margin-bottom: 16px;
  }

  .hero h1 .accent { color: var(--accent); }
  .hero h1 .green  { color: var(--green); }

  .hero p {
    font-size: 16px;
    color: var(--muted);
    max-width: 520px;
    margin: 0 auto 40px;
    line-height: 1.6;
  }

  /* ─── FILTER TABS ─── */
  .filters {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 48px;
  }

  .filter-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 8px 20px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .filter-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .filter-btn.active {
    background: rgba(0,212,255,0.1);
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 12px rgba(0,212,255,0.15);
  }

  /* Category colors */
  .filter-btn[data-cat="DevOps"].active    { background: rgba(0,255,157,0.1); border-color: var(--green);  color: var(--green);  }
  .filter-btn[data-cat="DevSecOps"].active { background: rgba(255,107,107,0.1); border-color: var(--red);   color: var(--red);    }
  .filter-btn[data-cat="MLOps"].active     { background: rgba(180,142,173,0.1); border-color: var(--purple); color: var(--purple); }
  .filter-btn[data-cat="Tools"].active     { background: rgba(255,209,102,0.1); border-color: var(--yellow); color: var(--yellow); }

  /* ─── GRID ─── */
  .main { padding: 0 40px 80px; max-width: 1200px; margin: 0 auto; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
  }

  /* ─── CARD ─── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.4s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    opacity: 0;
    transition: opacity 0.25s;
  }

  .card:hover { border-color: rgba(0,212,255,0.3); transform: translateY(-2px); }
  .card:hover::before { opacity: 1; }

  .card[data-cat="DevOps"]::before    { background: var(--green); }
  .card[data-cat="DevSecOps"]::before { background: var(--red); }
  .card[data-cat="MLOps"]::before     { background: var(--purple); }
  .card[data-cat="Tools"]::before     { background: var(--yellow); }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 14px;
  }

  .badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  .badge-DevOps    { background: rgba(0,255,157,0.12);   color: var(--green);  border: 1px solid rgba(0,255,157,0.2);   }
  .badge-DevSecOps { background: rgba(255,107,107,0.12); color: var(--red);    border: 1px solid rgba(255,107,107,0.2); }
  .badge-MLOps     { background: rgba(180,142,173,0.12); color: var(--purple); border: 1px solid rgba(180,142,173,0.2); }
  .badge-Tools     { background: rgba(255,209,102,0.12); color: var(--yellow); border: 1px solid rgba(255,209,102,0.2); }

  .card-arrow {
    color: var(--muted);
    font-size: 18px;
    transition: transform 0.2s, color 0.2s;
  }

  .card:hover .card-arrow { transform: translate(2px, -2px); color: var(--accent); }

  .card h3 {
    font-size: 17px;
    font-weight: 700;
    color: var(--white);
    margin-bottom: 10px;
    line-height: 1.3;
    letter-spacing: -0.3px;
  }

  .card p {
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.6;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 16px;
  }

  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 3px;
  }

  /* ─── MODAL ─── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(4px);
    z-index: 500;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 20px;
    overflow-y: auto;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    max-width: 680px;
    width: 100%;
    padding: 36px;
    position: relative;
    transform: translateY(20px);
    transition: transform 0.3s;
  }

  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-close {
    position: absolute;
    top: 20px; right: 20px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    color: var(--muted);
    width: 32px; height: 32px;
    border-radius: 6px;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }

  .modal-close:hover { color: var(--white); border-color: var(--accent); }

  .modal-cat { margin-bottom: 12px; }

  .modal h2 {
    font-size: 26px;
    font-weight: 800;
    color: var(--white);
    margin-bottom: 24px;
    letter-spacing: -0.5px;
  }

  .modal-content {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.9;
    color: var(--text);
    white-space: pre-wrap;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
  }

  /* ─── ADD NOTE ─── */
  .add-section {
    margin-top: 48px;
    border-top: 1px solid var(--border);
    padding-top: 40px;
  }

  .section-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 20px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }

  input, select, textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    color: var(--white);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(0,212,255,0.1);
  }

  select option { background: #111827; }

  textarea {
    resize: vertical;
    min-height: 100px;
    margin-bottom: 12px;
  }

  .submit-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    padding: 12px 28px;
    background: rgba(0,212,255,0.1);
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .submit-btn:hover {
    background: rgba(0,212,255,0.2);
    box-shadow: 0 0 20px rgba(0,212,255,0.2);
  }

  /* ─── STATS BAR ─── */
  .stats {
    display: flex;
    gap: 32px;
    justify-content: center;
    margin-bottom: 48px;
    flex-wrap: wrap;
  }

  .stat {
    text-align: center;
  }

  .stat-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
  }

  .stat-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 2px;
  }

  /* ─── LOADING ─── */
  .loading {
    text-align: center;
    padding: 60px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
    font-size: 13px;
  }

  .loading::after {
    content: '';
    animation: dots 1.2s steps(3, end) infinite;
  }

  @keyframes dots {
    0%   { content: '.'; }
    33%  { content: '..'; }
    66%  { content: '...'; }
    100% { content: '.'; }
  }

  .toast {
    position: fixed;
    bottom: 30px; right: 30px;
    background: var(--surface);
    border: 1px solid var(--green);
    color: var(--green);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    padding: 12px 20px;
    border-radius: 8px;
    z-index: 999;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
  }

  .toast.show { opacity: 1; transform: translateY(0); }

  @media (max-width: 600px) {
    header, .hero, .main { padding-left: 20px; padding-right: 20px; }
    .form-grid { grid-template-columns: 1fr; }
    .stats { gap: 20px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <div class="logo-icon">&gt;_</div>
    <div class="logo-text">Dev<span>Ops</span>Hub</div>
  </div>
  <div class="header-status">
    <div class="status-dot"></div>
    <span id="statusText">connecting...</span>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-tag">// knowledge base</div>
  <h1>From <span class="accent">DevOps</span><br>to <span class="green">MLOps</span></h1>
  <p>Everything a DevOps engineer needs to know — tools, practices, security, and the future of the field.</p>
</section>

<div class="main">

  <!-- STATS -->
  <div class="stats" id="stats"></div>

  <!-- FILTERS -->
  <div class="filters">
    <button class="filter-btn active" onclick="filter('all')">All</button>
    <button class="filter-btn" data-cat="DevOps"    onclick="filter('DevOps')">DevOps</button>
    <button class="filter-btn" data-cat="DevSecOps" onclick="filter('DevSecOps')">DevSecOps</button>
    <button class="filter-btn" data-cat="MLOps"     onclick="filter('MLOps')">MLOps</button>
    <button class="filter-btn" data-cat="Tools"     onclick="filter('Tools')">Tools</button>
  </div>

  <!-- CARDS GRID -->
  <div class="grid" id="grid">
    <div class="loading">fetching topics</div>
  </div>

  <!-- ADD YOUR OWN NOTE -->
  <div class="add-section">
    <div class="section-title">// add your own note</div>
    <div class="form-grid">
      <input type="text" id="f-title" placeholder="Topic title" />
      <select id="f-cat">
        <option value="">Category</option>
        <option>DevOps</option>
        <option>DevSecOps</option>
        <option>MLOps</option>
        <option>Tools</option>
      </select>
    </div>
    <textarea id="f-summary" placeholder="One-line summary (shown on card)"></textarea>
    <textarea id="f-content" placeholder="Full content (shown on expand)" style="min-height:140px; margin-bottom:12px;"></textarea>
    <input type="text" id="f-tags" placeholder="Tags: comma separated  e.g. Docker, CI/CD" style="margin-bottom:12px;" />
    <br>
    <button class="submit-btn" onclick="addTopic()">+ Add Topic</button>
  </div>

</div>

<!-- MODAL (expanded topic view) -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModalBtn()">✕</button>
    <div class="modal-cat" id="modal-cat"></div>
    <h2 id="modal-title"></h2>
    <div class="modal-content" id="modal-content"></div>
    <div class="tags" id="modal-tags" style="margin-top:20px;"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
  const API = window.API_URL || 'http://aa534bc1a3ff94b969b22f30cd17ea40-2062802394.eu-north-1.elb.amazonaws.com:3000';
  let allTopics = [];

  // ── Load topics from backend ──
  async function loadTopics() {
    try {
      const res = await fetch(`${API}/api/topics`);
      allTopics = await res.json();
      renderStats();
      renderCards(allTopics);
      document.getElementById('statusText').textContent = 'backend connected';
    } catch (e) {
      document.getElementById('grid').innerHTML =
        `<div class="loading" style="color:#ff6b6b;">backend offline — check docker compose</div>`;
      document.getElementById('statusText').textContent = 'offline';
    }
  }

  // ── Render stat numbers ──
  function renderStats() {
    const cats = ['DevOps', 'DevSecOps', 'MLOps', 'Tools'];
    const counts = cats.map(c => allTopics.filter(t => t.category === c).length);
    document.getElementById('stats').innerHTML = [
      ['Total', allTopics.length, 'var(--accent)'],
      ['DevOps', counts[0], 'var(--green)'],
      ['DevSecOps', counts[1], 'var(--red)'],
      ['MLOps', counts[2], 'var(--purple)'],
      ['Tools', counts[3], 'var(--yellow)'],
    ].map(([label, n, color]) => `
      <div class="stat">
        <div class="stat-num" style="color:${color}">${n}</div>
        <div class="stat-label">${label}</div>
      </div>
    `).join('');
  }

  // ── Render cards ──
  function renderCards(topics) {
    if (!topics.length) {
      document.getElementById('grid').innerHTML =
        '<div class="loading" style="color:var(--muted)">no topics in this category</div>';
      return;
    }
    document.getElementById('grid').innerHTML = topics.map((t, i) => `
      <div class="card" data-cat="${t.category}" onclick="openModal('${t._id}')"
           style="animation-delay:${i * 0.05}s">
        <div class="card-header">
          <span class="badge badge-${t.category}">${t.category}</span>
          <span class="card-arrow">↗</span>
        </div>
        <h3>${t.title}</h3>
        <p>${t.summary}</p>
        <div class="tags">${(t.tags || []).map(tag => `<span class="tag">${tag}</span>`).join('')}</div>
      </div>
    `).join('');
  }

  // ── Filter ──
  function filter(cat) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    const btn = cat === 'all'
      ? document.querySelector('.filter-btn:first-child')
      : document.querySelector(`[data-cat="${cat}"]`);
    if (btn) btn.classList.add('active');
    renderCards(cat === 'all' ? allTopics : allTopics.filter(t => t.category === cat));
  }

  // ── Modal ──
  function openModal(id) {
    const t = allTopics.find(t => t._id === id);
    if (!t) return;
    document.getElementById('modal-cat').innerHTML = `<span class="badge badge-${t.category}">${t.category}</span>`;
    document.getElementById('modal-title').textContent = t.title;
    document.getElementById('modal-content').textContent = t.content;
    document.getElementById('modal-tags').innerHTML = (t.tags || []).map(tag => `<span class="tag">${tag}</span>`).join('');
    document.getElementById('modal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal(e) {
    if (e.target === document.getElementById('modal')) closeModalBtn();
  }

  function closeModalBtn() {
    document.getElementById('modal').classList.remove('open');
    document.body.style.overflow = '';
  }

  // ── Add topic ──
  async function addTopic() {
    const title   = document.getElementById('f-title').value.trim();
    const category = document.getElementById('f-cat').value;
    const summary  = document.getElementById('f-summary').value.trim();
    const content  = document.getElementById('f-content').value.trim();
    const tags     = document.getElementById('f-tags').value.split(',').map(t => t.trim()).filter(Boolean);

    if (!title || !category || !summary || !content) {
      showToast('fill all fields', 'var(--red)'); return;
    }

    const res = await fetch(`${API}/api/topics`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, category, summary, content, tags })
    });

    if (res.ok) {
      // Clear form
      ['f-title','f-summary','f-content','f-tags'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('f-cat').value = '';
      showToast('✓ topic added');
      loadTopics(); // refresh
    } else {
      showToast('error adding topic', 'var(--red)');
    }
  }

  // ── Toast ──
  function showToast(msg, color = 'var(--green)') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.borderColor = color;
    t.style.color = color;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // keyboard close modal
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModalBtn();
  });

  loadTopics();
</script>
</body>
</html>
